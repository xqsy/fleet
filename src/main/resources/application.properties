spring.application.name=fleet

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/fleet}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml

spring.jpa.hibernate.ddl-auto=none

fleet.driver-workload.max-weekly-hours=40
fleet.driver-workload.max-daily-hours=12
fleet.driver-workload.min-rest-hours=8

management.endpoints.web.exposure.include=health,info,metrics

management.info.env.enabled=true
info.app.name=Fleet
info.app.description=Fleet management service

trip-cost-service.url=${TRIP_COST_SERVICE_URL:http://localhost:8081}

spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:fleet}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:fleet}

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=fleet
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JacksonJsonDeserializer
spring.kafka.consumer.properties.spring.json.value.default.type=dev.fleet.dto.response.TripCostResponse
spring.kafka.consumer.properties.spring.json.use.type.headers=false