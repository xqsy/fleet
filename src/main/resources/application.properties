spring.application.name=fleet

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/fleet}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml

spring.jpa.hibernate.ddl-auto=none

fleet.driver-workload.max-weekly-hours=40
fleet.driver-workload.max-daily-hours=12
fleet.driver-workload.min-rest-hours=8

management.endpoints.web.exposure.include=health,info,metrics

management.info.env.enabled=true
info.app.name=Fleet
info.app.description=Fleet management service