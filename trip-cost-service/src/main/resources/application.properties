spring.application.name=trip-cost-service

server.port=8081

spring.mongodb.uri=mongodb://${MONGO_USER:mongo}:${MONGO_PASSWORD:mongo}@${MONGO_HOST:localhost}:${MONGO_PORT:27017}/${MONGO_DATABASE:trip-costs}?authSource=admin

trip-cost.fuel-consumption-per-km=0.12
trip-cost.fuel-price-per-liter=1.70

spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:fleet}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:fleet}
spring.rabbitmq.listener.simple.default-requeue-rejected=false

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JacksonJsonSerializer
spring.kafka.producer.properties.spring.json.add.type.headers=false