services:
  db:
    image: postgres:18
    container_name: fleet-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-fleet}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - fleet-postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]

  mongo:
    image: mongo:8
    container_name: fleet-mongo
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-mongo}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-mongo}
      MONGO_INITDB_DATABASE: ${MONGO_DATABASE:-trip-cost}
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - fleet-mongo-data:/data/db

  trip-cost-service:
    build:
      context: .
      dockerfile: trip-cost-service/Dockerfile
    container_name: trip-cost-service
    environment:
      MONGO_HOST: ${MONGO_HOST:-mongo}
      MONGO_PORT: ${MONGO_PORT:-27017}
      MONGO_USER: ${MONGO_USER:-mongo}
      MONGO_PASSWORD: ${MONGO_PASSWORD:-mongo}
      MONGO_DATABASE: ${MONGO_DATABASE:-trip-cost}
    ports:
      - "${TRIP_COST_SERVICE_PORT:-8081}:8081"
    depends_on:
      - mongo


  app:
    build: .
    container_name: fleet-app
    environment:
      DB_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-fleet}
      DB_USERNAME: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      TRIP_COST_SERVICE_URL: http://trip-cost-service:8081
    ports:
      - "${APP_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy
        
volumes:
  fleet-postgres-data:
  fleet-mongo-data: